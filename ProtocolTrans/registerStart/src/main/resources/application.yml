spring:
  application:
    name: ProtocolTrans
  
  messages:
    basename: i18n/messages

  devtools:
    restart:
      enabled: true

logging:
  level:
    root: info
    com.example: debug
    org.springframework: warn
  file:
    name: logs/protocol-trans.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  logback:
    rolling-policy:
      max-file-size: 100MB
      max-history: 30

# modbus从站配置
modbus:
  client:
    enabled: true
    timeout: 5000
    retries: 3
    max-connections: 10
    idle-timeout: 30000
  tcp:
    enabled: true
    port: 502
    encapsulated: false

# Modbus寄存器映射数据类型
register-types:
  "combinedActiveTotalElectric":          "float32"   # 占用偏移 0-1
  "rightActiveTotalElectric":             "uint32"    # 占用偏移 2-3
  "reverseActiveRotalElectric":           "uint32"    # 占用偏移 4-5
  "instantaneousActivePower":             "float32"   # 占用偏移 6-7
  "combinedActivePowerRateOneElectric":   "float32"   # 占用偏移 8-9
  "maximumForwardActiveDemand":           "float32"   # 占用偏移 10-11
  "phaseACurrent":                        "float32"   # A相电流，占用偏移 12-13
  "phaseALoseVoltageRecord":              "float32"   # A相失压记录（上一次）14-15
  "tableNumber":                          "float32"   # 表号，占用偏移 16-17
  "ActiveEnergyConstantOfMeter":          "float32"   # 电表有功常数，占用偏移 18-19

# 电表采集配置
meter:
  collection:
    cron: "0/2 * * * * ?"
    devices:
