      - name: "电表2 (645串口)"
        type: serial
        protocol: dl645
        index: 0
        comPort: COM3
        address: "003403889900"
        timeout: 1000
        baudRate: 2400
        di-mapping:
          "combinedActiveTotalElectric":        "00000000"  # 组合有功总电能
          "rightActiveTotalElectric":           "00010000"  # 正向有功总电能
          "reverseActiveRotalElectric":         "00020000"  # 反向有功总电能
          "instantaneousActivePower":           "02030000"  # 瞬时有功功率
          "combinedActivePowerRateOneElectric": "00000101"  # 组合有功费率（1）电能（上1结算日）
          "maximumForwardActiveDemand":         "01010000"  # 正向有功最大需量
          "phaseACurrent":                      "02020100"  # A相电流
          "phaseALoseVoltageRecord":            "03010101"  # A相失压记录（上一次）
          "tableNumber":                        "04000402"  # 表号
          "ActiveEnergyConstantOfMeter":        "04000409"  # 电表有功常数

