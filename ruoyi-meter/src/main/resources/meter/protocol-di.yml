protocol:
  # 协议点位映射：pointCode -> 配置 (DL/T645-2007)
  # 支持两种写法：
  # 1) 简写： "50001": "00010000"
  # 2) 完整：
  #    "50001":
  #      di: "00010000"
  #      pointName: "组合有功总电能"
  #      unit: "kWh"
  #      decimals: 2
  #      scale: 1.0
  dl645:
    di:
      "50001":
        di: "00010000"
        pointName: "组合有功总电能"
        unit: "kWh"
        decimals: 2
        scale: 1.0
      "50002":
        di: "00010200"
        pointName: "正向有功总电能"
        unit: "kWh"
        decimals: 2
        scale: 1.0
      "50003":
        di: "00020200"
        pointName: "反向有功总电能"
        unit: "kWh"
        decimals: 2
        scale: 1.0
      "50004": "02030000" # 简写示例：瞬时有功功率
      "50005": "00000101" # 简写示例：组合有功费率(1)电能

  # 预留：DL/T698 的 OAD 映射（当前不启用）
  dlt698:
    oad:
      "50001": "00000201"
      "50002": "00100201"
      "50003": "00100202"
