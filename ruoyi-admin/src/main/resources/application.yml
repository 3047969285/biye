# 项目相关配置
ruoyi:
  # 设备规则定时重算（最新状态闭环；答辩可讲「采集触发 + 调度补偿」）
  equipment:
    rule-reevaluate-enabled: true
    rule-reevaluate-initial-ms: 120000
    rule-reevaluate-interval-ms: 900000
  # 名称
  name: 智能电网运维系统
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 电表 Modbus：网口接收与开放汇总接口（点表见 /meter/point，执行 sql/meter_modbus.sql）
meter:
  modbus:
    tcp-enabled: false
    tcp-port: 5021
    tcp-binary: false
    ingest-api-key: ""
    summary-include-point-table: true

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ruoyi.log

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 允许 Bean 定义覆盖（解决自定义 vectorStore 与 Milvus 自动配置冲突）
  main:
    allow-bean-definition-overriding: true
  # 禁用 SQL 初始化（避免与 MyBatis Mapper 冲突）
  sql:
    init:
      mode: never
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关 (优化：禁用热部署以减少内存占用)
      enabled: false
  # redis 配置
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为 6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接 (优化：减少空闲连接)
          min-idle: 0
          # 连接池中的最大空闲连接 (优化：减少空闲连接)
          max-idle: 4
          # 连接池的最大数据库连接数 (优化：减少最大连接数)
          max-active: 4
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # Spring AI 阿里巴巴通义千问配置
  ai:
    dashscope:
      # 建议通过环境变量提供，避免明文密钥泄露
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          # 快速版：延迟低、单价低于 qwen-plus；需最新能力可改为 qwen-turbo-latest
          model: qwen-turbo
          temperature: 0.7
          max-output-tokens: 1024
          top-p: 0.9
      embedding:
        options:
          # 向量模型：用于知识库入库与相似度检索
          model: text-embedding-v3
    # SimpleVectorStore 内存向量存储配置
    vectorstore:
      simple:
        store-file: data/vector-store.json  # 持久化文件路径
  # 排除有问题的自动配置
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz1234567
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger 配置 (优化：生产环境可禁用以减少内存占用)
swagger:
  # 是否开启 swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 风力发电 Python 预测（predict.py FastAPI，默认 8989；随 Spring 启动子进程 + 定时自动预测）
# 首次请先安装依赖：cd 风力发电第二版 && python -m pip install -r requirements.txt
# 若报 ModuleNotFoundError：把下面 python-command 改成「已装依赖」的解释器全路径，例如 D:/venv/Scripts/python.exe
wind:
  forecast:
    enabled: true
    auto-start-python: true
    python-command: python
    # 相对项目根目录；部署时请改为绝对路径
    work-dir: ${user.dir}/风力发电第二版
    service-host: 127.0.0.1
    service-port: 8989
    model-path: ${user.dir}/风力发电第二版/model/gru_FD.h5
    feature-excel: ${user.dir}/风力发电第二版/FD001.xlsx
    real-excel: ${user.dir}/风力发电第二版/FD001_real.xlsx
    # 曲线点数（15 分钟一点：192 点 = 48 小时）
    predict-length: 192
    # 预测起点：≥0 从测试段内该下标开始；<0（默认 -1）对齐到测试段末尾，使用 Excel 中最新时段
    predict-start-index: -1
    # 每个预测曲线点对应的物理时间间隔（分钟），用于前端换算时长；与 Excel 一行代表的时间一致（如 15 分钟一行填 15）
    forecast-point-interval-minutes: 15
    # 对比段之后再输出约多少分钟「仅预测、无实测」曲线（Python 按间隔换算点数）
    forecast-extra-minutes: 120
    # 表末之后再自回归多预测的点数（无实测，约 36×15min=9h）
    beyond-data-points: 36
    time-step: 30
    test-size: 0.2
    schedule-initial-delay-ms: 15000
    # 自动预测间隔（毫秒），默认 3 分钟，与前端轮询、运维表单扫描周期对齐
    schedule-interval-ms: 180000
    http-timeout-seconds: 300
    # 与 sql 中「发电机1号」device_id=7（DEV-007）对应；预测成功会更新该设备当日 eq_device_stat.average_power
    bind-device-id: "57330e93-592e-5318-b0c2-6d3ff8846bb6"
    # 预测成功后是否写入 eq_prediction（与 Python FastAPI /predict 返回的 rmse/mae/r2 等映射）
    persist-eq-prediction: true